name: arm64

# Builds only the 64-bit Raspberry Pi (Debian bookworm) binary, as the cross/arm64 job in build.yml.
on:
  push:
  workflow_dispatch:

jobs:
  arm64:
    runs-on: ubuntu-latest
    container: "node:current-bookworm-slim"
    steps:
      - uses: actions/checkout@v4
      - name: Install basic tools
        run: |
          apt-get update
          apt-get install --assume-yes --no-install-recommends curl ca-certificates protobuf-compiler
      - name: Install arm64 cross compiler and gstreamer
        run: |
          dpkg --add-architecture arm64
          apt-get update
          apt-get install --assume-yes --no-install-recommends \
          build-essential \
          gcc-aarch64-linux-gnu \
          g++-aarch64-linux-gnu \
          libgstrtspserver-1.0-dev:arm64 \
          libgstreamer1.0-dev:arm64 \
          libgtk2.0-dev:arm64 \
          libglib2.0-dev:arm64 \
          libssl-dev:arm64
      - name: Install rustup
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- --no-modify-path --quiet -y
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
      - name: Install arm64 Rust toolchain
        run: rustup target add aarch64-unknown-linux-gnu
      - name: Build
        run: cargo build --release --verbose --all-features --target=aarch64-unknown-linux-gnu
        env:
          PKG_CONFIG_ALLOW_CROSS: 1
          PKG_CONFIG_LIBDIR: /usr/lib/aarch64-linux-gnu/pkgconfig
          JEMALLOC_SYS_WITH_LG_PAGE: 16
      - uses: actions/upload-artifact@v4
        with:
          name: neolink-arm64-bookworm
          path: "target/aarch64-unknown-linux-gnu/release/neolink"
